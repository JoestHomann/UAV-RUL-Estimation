experiments = ["PE_dense_current20", "PE_dense_stride5"]
reporter = "pipeline_experiments/report_experiment_group.py"

# PE_run_3 is deliberately staged. Run these groups in declaration order and
# freeze each winner before changing the downstream group's source feature set.
[experiment_groups.PE3_feature_union]
pipeline_run = "PE_run_3"
control = "PE3_features_drift"
experiments = [
    "PE3_features_drift",
    "PE3_features_signal",
    "PE3_features_union",
]
reporter = "pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE3_cap_sensitivity]
