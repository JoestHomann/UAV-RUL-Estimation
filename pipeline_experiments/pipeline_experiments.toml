control = "PE3_cap_125"
experiments = ["PE3_cap_125", "PE3_cap_110", "PE3_cap_140", "PE3_cap_150"]
reporter = "pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE3_ensemble_calibration]
pipeline_run = "PE_run_3"
control = "PE3_features_union"
experiments = ["PE3_features_union"]
reporter = "pipeline_experiments/report_ensemble_calibration.py"
blend_weights = [0.25, 0.50, 0.75]
calibration_degree = 2
calibration_ridge_alpha = 10.0

[experiment_groups.PE3_severity_loss]
pipeline_run = "PE_run_3"
control = "PE3_safety_symmetric"
experiments = [
    "PE3_safety_symmetric",
    "PE3_safety_severity_1_5",
    "PE3_safety_severity_2_0",
    "PE3_safety_severity_3_0",
]
reporter = "pipeline_experiments/report_experiment_group.py"

[experiment_workflows.PE_run_3]
feature_group = "PE3_feature_union"
cap_group = "PE3_cap_sensitivity"
ensemble_group = "PE3_ensemble_calibration"
safety_group = "PE3_severity_loss"
promotion = "PE3_final_ensemble"
# Final safety candidates may lose at most this absolute development R2 relative
# to the best observed candidate before one-sided error metrics decide.
safety_r2_tolerance = 0.005

[promotions.PE3_final_ensemble]
workflow = "PE_run_3"
ensemble_group = "PE3_ensemble_calibration"

