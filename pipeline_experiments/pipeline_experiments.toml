overprediction_weight = 3.0
quantile = 0.5
severity_scale = 10.0
calibration = "none"
safety_offset = 0.0
non_overprediction_coverage = 0.5

[experiment_groups.PE_signal_family_ablation]
pipeline_run = "PE_run_2"
control = "PE_signal_control"
experiments = [
    "PE_signal_control",
    "PE_signal_family_13_16_22_25_28",
