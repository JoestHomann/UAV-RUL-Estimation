# Human-readable source of truth for the Phase 2 architecture study.
#

# To watch training progress live while Step 5/6 run, open a second
# PowerShell terminal in the repository root and launch TensorBoard:
#   .\.venv\Scripts\python.exe 2_model_architecture_study\tensorboard_monitoring\launch_tensorboard.py
# Then open the printed address in a browser, normally http://localhost:6006


# Later scripts read the generated JSON specification, which is created from
# this file only after schema and Phase 1 input verification.  Scientific
# values cannot be overridden through command-line flags.  This keeps every
# run traceable to one inspectable configuration.
#
# This integer is incremented manually whenever an experiment setting
# changes.  It is a simple revision number, not an automatic model or data
# version.
settings_version = 4

[execution]
# How many independent Step 5/6 family/outer-fold studies run at the same
# time, each as its own subprocess. "auto" uses every available CPU core
# (matching the previous hardcoded default); any positive integer runs
# exactly that many at once, and 1 runs strictly sequentially.
# Unlike every other setting in this file, this is an execution/performance
# knob rather than a scientific one -- it changes wall-clock time only, never
# results -- so run_phase_2.py's --max-workers flag is allowed to override it
# for one-off runs without touching this file.
# Options: "auto", or any positive integer.
max_workers = "auto"

[study]
# The architectures that run in the comparison. Nothing here forces any of
# them to stay enabled -- disabling one via [study.enabled] below simply
# drops it from the run, the same way a conditional or optional architecture
# is skipped.
# Conditional and optional architectures stay explicit in this settings file
# but are skipped while disabled in [study.enabled] below.
# Options: any architecture name that also has an [architectures.*] table
# below (currently mean_baseline, cycle_only_baseline, regularized_linear,
# random_forest, xgboost, mlp, tcn, lstm, transformer, rbf_svr). Every such
# name must appear in exactly one of the three lists below.
architectures_to_run = [
    "mean_baseline",
    "cycle_only_baseline",
    "regularized_linear",
    "random_forest",
    "xgboost",
    "mlp",
    "tcn",
    "lstm",
]
conditional_architectures = ["transformer"]  # gated on a prerequisite, not results: promote once TCN/LSTM prove out (data has only 100 independent UAVs, so attention is an overfitting risk until then)
optional_architectures = ["rbf_svr"]  # not prerequisite-gated: a reasonable extra nonlinear reference, added only if the core comparison leaves a question open or time allows

[study.enabled]
# The single on/off switch for every architecture declared above. Setting an
# entry to false drops that architecture from the run, the same way a
# conditional or optional architecture is skipped -- nothing else in this
# file needs to change to turn a model off or on. Every name listed in
# architectures_to_run, conditional_architectures, and
# optional_architectures above must appear here exactly once.
mean_baseline = true
cycle_only_baseline = true
regularized_linear = true
random_forest = true
xgboost = true
mlp = true
tcn = true
lstm = true
transformer = false
rbf_svr = false

# The pipeline always saves every architecture's predictions, metrics, and
# comparison plots, and never declares a winner: the final selection is made
# by the user after inspecting the complete evidence. These are fixed
# pipeline behaviors, not configurable settings, so there is nothing to set
# here for them.

[tuning]
# Hyperparameters are optimized independently inside each architecture
# family.  The tuner may choose the best configuration of a model, but it may
# not choose one architecture over another.
# Any positive integer: the number of distinct candidate configurations
# Optuna tries per tunable architecture family. Architectures with no tunable
# choices (the two baselines) always use exactly one candidate regardless of
# this value.
candidate_budget_per_architecture = 20

# The search seed makes candidate generation repeatable.  The retraining
# seeds quantify variation in stochastic architectures after tuning has
# finished.
# Any integer.
search_seed = 13
# Any list of distinct integers; one retraining run is produced per seed for
# stochastic architectures (random_forest, xgboost, mlp, tcn, lstm).
retraining_seeds = [13, 37, 73]

# For early-stopped models, outer-fold retraining uses the median best
# iteration/epoch found in the inner folds when retraining on the outer-fold
# development data.  This avoids looking at the outer validation targets to
# decide training duration.

[evaluation]
# Every architecture is evaluated with the same metrics and report
# breakdowns.  RMSE is the tuning objective; the other metrics expose
# complementary error properties and are not combined into an automatic
# ranking score.
# Options: any subset of "r2", "rmse", "mae", "bias".
metrics = ["r2", "rmse", "mae", "bias"]
# Options: any subset of "overall", "scenario", "outer_fold", "age_band",
# "lifetime_quantile".
reported_groups = [
    "overall",
    "scenario",
    "outer_fold",
    "age_band",
    "lifetime_quantile",
]

# RUL cannot be negative, so reported predictions are clipped at zero.  Equal
# total UAV weight prevents UAVs that generated more prefix samples from
# having greater influence solely because of their history length.
# Any float; predictions below this value are clipped up to it.
prediction_minimum = 0.0

# Resampling whole UAVs preserves the dependence among prefixes from the same
# vehicle when confidence intervals are calculated.
# Any positive integer: the number of bootstrap resamples drawn.
bootstrap_repetitions = 1000
# Any integer.
bootstrap_seed = 20260814

[representations]
# Tabular adapters select one of the Phase 1 feature-set columns.  Sequence
# adapters instead receive ordered telemetry windows from the explicit
# channel list below; the two input forms are kept separate by the verifier.
# Options: any subset of "age_only", "last_values", "screened",
# "all_nonconstant". Each [architectures.*] table's own "feature_sets" list
# must be a subset of the set chosen here.
tabular_feature_sets = [
    "age_only",
    "last_values",
    "screened",
    "all_nonconstant",
]

# These are the 22 telemetry channels retained after Phase 0
# constant-feature screening.  Storing every name explicitly prevents later
# code from depending on incidental CSV column order.
# Any positive integer; must equal the number of entries in
# "sequence_channels" below.
sequence_channel_count = 22
# Any list of unique channel-name strings, with as many entries as
# "sequence_channel_count" declares.
sequence_channels = [
    "telemetry_01",
    "telemetry_02",
    "telemetry_04",
    "telemetry_05",
    "telemetry_06",
    "telemetry_07",
    "telemetry_09",
    "telemetry_10",
    "telemetry_11",
    "telemetry_12",
    "telemetry_13",
    "telemetry_15",
    "telemetry_16",
    "telemetry_18",
    "telemetry_19",
    "telemetry_21",
    "telemetry_22",
    "telemetry_23",
    "telemetry_24",
    "telemetry_25",
    "telemetry_26",
    "telemetry_28",
]

# Each sequence model is compared at the same history-window lengths below.
# Histories shorter than the selected lookback are padded on the left, and
# the mask tells the model which time steps are padding rather than
# observations.
# Any list of positive integers (history lengths in flight cycles). Each
# sequence [architectures.*] table's own "lookbacks" list must be a subset of
# the list chosen here.
sequence_lookbacks = [50, 100]

# Absolute age is supplied alongside telemetry because a fixed-length window
# alone does not identify the UAV's current point in its observed lifetime.
# Options: any subset of "flight_cycle", "log1p_flight_cycle".
sequence_side_features = ["flight_cycle", "log1p_flight_cycle"]

[preprocessing]
# Models sensitive to feature scale use robust median/IQR scaling.  Tree
# models receive unchanged numeric values because their split ordering does
# not need scale normalization.
# Any list of architecture names that should receive scaled tabular inputs.
scaled_tabular_architectures = ["regularized_linear", "mlp", "rbf_svr"]
# Any list of architecture names that should receive unscaled tabular
# inputs.
unscaled_tree_architectures = ["random_forest", "xgboost"]

# Every fitted preprocessing statistic is learned only from training UAVs in
# the current fold.  Validation UAVs may be transformed but never influence
# the medians or IQRs, preventing validation leakage.

[neural_training]
# These settings are shared by MLP, TCN, LSTM, and the disabled Transformer
# so their comparison does not accidentally use different optimization
# policies.  Architecture-specific sizes, dropout, and learning rates remain
# tunable below.
# Any positive integer.
batch_size = 64
# Any positive integer; the hard ceiling on training epochs regardless of
# early stopping.
maximum_epochs = 150
# Any positive integer; epochs to wait for validation improvement before
# stopping early.
early_stopping_patience = 15
# Any positive float; the maximum global gradient norm allowed before
# clipping.
gradient_clip_global_norm = 1.0

# Baselines ------------------------------------------------------------------
# Baselines verify that complex models improve on simple references.  The
# mean baseline needs no model input; the cycle-only baseline receives only
# age.

[architectures.mean_baseline]
# Options: "included", "conditional", "optional"; must match which of the
# three [study] lists above this architecture's name appears in.
status = "included"
# Options: "none", "tabular", "sequence". Determines which of "feature_sets"
# (tabular) or "lookbacks" (sequence) may be set below; "none" allows
# neither.
representation = "none"
# Options: exactly {"mean"} for this architecture (enforced by the verifier).
variants = ["mean"]

[architectures.cycle_only_baseline]
status = "included"
representation = "tabular"
feature_sets = ["age_only"]
# Options: exactly {"weighted_linear"} for this architecture.
variants = ["weighted_linear"]

# Tabular architectures ------------------------------------------------------
# All tabular families consume the same Phase 1 prefix-feature rows.  Their
# "feature_sets" lists define which predeclared feature subsets are compared.

[architectures.regularized_linear]
status = "included"
representation = "tabular"
feature_sets = ["age_only", "last_values", "screened", "all_nonconstant"]
# Options: exactly {"ridge", "elastic_net"} for this architecture.
variants = ["ridge", "elastic_net"]

[architectures.regularized_linear.search.variant]
# The variant choice activates either the ridge parameter or both Elastic Net
# parameters.  Inactive variant-specific values are ignored by its adapter.
# Options: "fixed", "categorical", "categorical_integer_sequences",
# "integer_range", "uniform", "log_uniform"; each "kind" requires its own
# matching fields ("value" for fixed; "values" for categorical and
# categorical_integer_sequences; "low"/"high"[/"step"] for the numeric
# ranges).
kind = "categorical"
values = ["ridge", "elastic_net"]

[architectures.regularized_linear.search.ridge_alpha]
kind = "log_uniform"
low = 1e-4
high = 1e4

[architectures.regularized_linear.search.elastic_net_alpha]
kind = "log_uniform"
low = 1e-5
high = 1e2

[architectures.regularized_linear.search.elastic_net_l1_ratio]
kind = "categorical"
values = [0.05, 0.2, 0.5, 0.8, 0.95]

[architectures.random_forest]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
# Options: exactly {"random_forest"} for this architecture.
variants = ["random_forest"]

[architectures.random_forest.search.n_estimators]
kind = "fixed"
value = 500

[architectures.random_forest.search.max_depth]
# "none" is a portable TOML sentinel that the model adapter converts to
# Python "None". TOML has no native null value.
kind = "categorical"
values = ["none", 5, 10, 20]

[architectures.random_forest.search.min_samples_leaf]
kind = "categorical"
values = [1, 2, 5, 10]

[architectures.random_forest.search.max_features]
kind = "categorical"
values = [0.33, 0.67, 1.0]

[architectures.xgboost]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
# Options: exactly {"xgboost"} for this architecture.
variants = ["xgboost"]
# Any positive integer; XGBoost-specific early-stopping rounds (this field is
# only meaningful for xgboost; other architectures share
# [neural_training].early_stopping_patience instead).
early_stopping_patience = 35

# A large fixed tree ceiling works with early stopping: training may stop
# well before 1,500 trees when the inner-fold validation score no longer
# improves.

[architectures.xgboost.search.maximum_trees]
kind = "fixed"
value = 1500

[architectures.xgboost.search.learning_rate]
kind = "log_uniform"
low = 0.01
high = 0.2

[architectures.xgboost.search.max_depth]
kind = "categorical"
values = [2, 3, 4, 6, 8]

[architectures.xgboost.search.min_child_weight]
kind = "log_uniform"
low = 0.5
high = 20.0

[architectures.xgboost.search.subsample]
kind = "uniform"
low = 0.6
high = 1.0

[architectures.xgboost.search.colsample_bytree]
kind = "uniform"
low = 0.5
high = 1.0

[architectures.xgboost.search.reg_alpha]
kind = "log_uniform"
low = 1e-8
high = 10.0

[architectures.xgboost.search.reg_lambda]
kind = "log_uniform"
low = 1e-3
high = 100.0

# Neural architectures -------------------------------------------------------
# The MLP uses engineered tabular rows.  TCN and LSTM use padded ordered
# telemetry windows, allowing the study to compare feature-based and
# end-to-end sequence representations under the same folds and metrics.

[architectures.mlp]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
# Options: exactly {"mlp"} for this architecture.
variants = ["mlp"]

[architectures.mlp.search.hidden_layers]
# Each nested integer list is one complete hidden-layer layout, e.g.
# [128, 64] means a two-layer MLP with 128 then 64 hidden units.
kind = "categorical_integer_sequences"
values = [[64], [128, 64], [256, 128]]

[architectures.mlp.search.dropout]
kind = "uniform"
low = 0.0
high = 0.5

[architectures.mlp.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.mlp.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

[architectures.tcn]
status = "included"
representation = "sequence"
# Any subset of the top-level [representations].sequence_lookbacks list.
lookbacks = [50, 100]
# Options: exactly {"tcn"} for this architecture.
variants = ["tcn"]

[architectures.tcn.search.residual_blocks]
kind = "categorical"
values = [2, 3, 4]

[architectures.tcn.search.channels]
kind = "categorical"
values = [32, 64, 128]

[architectures.tcn.search.kernel_size]
kind = "categorical"
values = [3, 5, 7]

[architectures.tcn.search.dilation_base]
# Fixed doubling of dilation expands the temporal receptive field across
# residual blocks while keeping the tunable search space compact.
kind = "fixed"
value = 2

[architectures.tcn.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

[architectures.tcn.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.tcn.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

[architectures.lstm]
status = "included"
representation = "sequence"
lookbacks = [50, 100]
# Options: exactly {"lstm"} for this architecture.
variants = ["lstm"]

[architectures.lstm.search.layers]
kind = "categorical"
values = [1, 2]

[architectures.lstm.search.hidden_units]
kind = "categorical"
values = [32, 64, 128]

[architectures.lstm.search.direction]
# Only past and current observations may influence a prediction.  A
# unidirectional LSTM makes that temporal direction explicit.
kind = "fixed"
value = "unidirectional"

[architectures.lstm.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

[architectures.lstm.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.lstm.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Disabled extensions --------------------------------------------------------
# Disabled architectures remain fully specified so enabling one is a
# deliberate one-line change in [study.enabled] above and uses a documented
# search space. They are not run in the comparison while disabled there.

[architectures.transformer]
# Options: "included", "conditional", "optional"; must match which [study]
# list this architecture's name appears in ("transformer" is in
# conditional_architectures above).
status = "conditional"
representation = "sequence"
lookbacks = [50, 100]
# Options: exactly {"transformer_encoder"} for this architecture.
variants = ["transformer_encoder"]

[architectures.transformer.search.encoder_layers]
kind = "categorical"
values = [1, 2, 3]

[architectures.transformer.search.model_width]
kind = "categorical"
values = [32, 64, 128]

[architectures.transformer.search.attention_heads]
kind = "categorical"
values = [2, 4, 8]

[architectures.transformer.search.feed_forward_ratio]
kind = "categorical"
values = [2, 4]

[architectures.transformer.search.position_encoding]
kind = "fixed"
value = "sinusoidal"

[architectures.transformer.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

[architectures.transformer.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.transformer.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

[architectures.rbf_svr]
# Options: "included", "conditional", "optional"; "rbf_svr" is in
# optional_architectures above.
status = "optional"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
# Options: exactly {"rbf_svr"} for this architecture.
variants = ["rbf_svr"]

[architectures.rbf_svr.search.c]
kind = "log_uniform"
low = 1e-2
high = 1e3

[architectures.rbf_svr.search.gamma]
kind = "log_uniform"
low = 1e-5
high = 1.0

[architectures.rbf_svr.search.epsilon]
kind = "log_uniform"
low = 1e-3
high = 10.0

# Phase 1 inputs -------------------------------------------------------------
# Phase 2 consumes the already constructed folds, prefix samples, engineered
# features, preprocessing definition, and metric definition from Phase 1.
# Paths remain relative to the repository root so the project is portable.
#
# No hashes or frozen copies are used.  Instead, the verifier checks the
# stable interface needed by Phase 2: file existence, dimensions, required
# fields, critical values, passed leakage assertions, and cross-file
# agreement.

[phase_1]
# These expected quantities summarize the dataset-construction protocol.  A
# mismatch indicates that Phase 1 changed and these settings must be
# reviewed.
expected_training_uavs = 100
expected_outer_folds = 5
expected_inner_folds_per_outer_fold = 4
expected_development_scenarios = 5
expected_locked_scenarios = 20
expected_prefixes_per_training_uav = 20
expected_generated_features = 606

[phase_1.expected_feature_sets]
# Values are counts of "feature__*" columns in each named Phase 1 feature
# set.
age_only = 2
last_values = 24
screened = 310
all_nonconstant = 606

[phase_1.artifacts.verification_report]
# JSON artifacts declare keys that must exist and selected scalar values that
# must match exactly.  Other metadata may evolve without breaking these
# settings.
path = "1_dataset_construction/10_automated_leakage_checks/artifacts/verification_report.json"
# Options: "csv", "json".
format = "json"
required_json_keys = ["status", "assertions", "feature_files", "feature_sets"]

[phase_1.artifacts.verification_report.required_json_values]
status = "passed"
development_scenarios = 5
locked_scenarios = 20

[phase_1.artifacts.fold_config]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/fold_config.json"
format = "json"
required_json_keys = ["group_key", "outer_folds", "inner_folds", "seed"]

[phase_1.artifacts.fold_config.required_json_values]
group_key = "uav_id"
outer_folds = 5
inner_folds = 4

[phase_1.artifacts.outer_folds]
# CSV artifacts declare their row/column dimensions and metadata interface.
# Feature tables additionally declare "feature_columns" below.
