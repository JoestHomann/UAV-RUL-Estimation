# Human-readable source of truth for the Phase 2 architecture study. Scripts
# read the JSON specification generated from this file, and only after schema
# and Phase 1 verification pass, so every run traces to one configuration.
# Scientific values cannot be overridden with command-line flags.
#
# Live training progress: in a second PowerShell terminal at the repository
# root run tensorboard_monitoring\launch_tensorboard.py, then open the printed
# address, normally http://localhost:6006

# Revision number of this configuration, incremented by hand on any change.
settings_version = 10    # Options: any positive integer

# Which "runs/run_<n>/" folder Steps 5-7 use; hand-edited only, so an
# interrupted run resumes into the folder it started in.
run_number = 4    # Options: any positive integer

[execution]
# Step 5/6 studies run at once, each a subprocess; the one performance-only
# knob here, so --max-workers may override it without editing this file.
max_workers = 6    # Options: "auto", or any positive integer

[study]
# Architectures in the comparison. Every name in the three lists below needs an
# [architectures.*] table and must appear in exactly one list.
architectures_to_run = [    # Options: any declared architecture name
    "mean_baseline",
    "cycle_only_baseline",
    "regularized_linear",
    "random_forest",
    "extra_trees",
    "xgboost",
    "catboost",
    "mlp",
    "tcn",
    "multiscale_cnn",
    "sensor_graph_tcn",
    "lstm",
]
# Held back on a prerequisite, not on results: promote the transformer once TCN
# and LSTM prove out, since 100 UAVs make attention an overfitting risk.
conditional_architectures = ["transformer"]    # Options: any declared name
# Neither required nor gated, added only if a question stays open or time allows.
optional_architectures = ["rbf_svr", "trajectory_dtw_knn"]    # Options: any declared name

[study.enabled]
# The single on/off switch per architecture; false drops it from the run and
# nothing else changes. Every name in the three [study] lists appears once here.
# Options: true, false.
mean_baseline = true
cycle_only_baseline = true
regularized_linear = true
random_forest = true
extra_trees = true
xgboost = true
catboost = true
mlp = true
tcn = true
multiscale_cnn = true
sensor_graph_tcn = true
lstm = true
transformer = true
rbf_svr = true
trajectory_dtw_knn = true
# Saving every architecture's results and never declaring a winner are fixed
# pipeline behaviors with nothing to configure.

[tuning]
# Candidate configurations Optuna tries per tunable family; the two baselines
# have nothing to tune and always use one.
candidate_budget_per_architecture = 25    # Options: any positive integer
# Seed making candidate generation repeatable.
search_seed = 13    # Options: any integer
# Seeds quantifying run-to-run variation, one retraining run each for the
# stochastic families (random_forest, extra_trees, xgboost, catboost, mlp,
# tcn, multiscale_cnn, sensor_graph_tcn, lstm, transformer).
retraining_seeds = [13, 37, 73]    # Options: any list of distinct integers
# Early-stopped models retrain for the median best iteration found in the inner
# folds, so training duration never looks at outer validation targets.

[evaluation]
# Metrics for every architecture and group; RMSE is the tuning objective and
# the rest are never combined into an automatic ranking score.
metrics = ["r2", "rmse", "mae", "bias"]    # Options: any subset of these four
# Breakdowns reported alongside the overall result.
reported_groups = [    # Options: any subset of the five below
    "overall",
    "scenario",
    "outer_fold",
    "age_band",
    "lifetime_quantile",
]
# Floor on reported predictions, since remaining useful life cannot be negative.
prediction_minimum = 0.0    # Options: any float
# Bootstrap resamples for confidence intervals, resampling whole UAVs so
# prefixes from one vehicle stay together.
bootstrap_repetitions = 1000    # Options: any positive integer
# Seed making the bootstrap repeatable.
bootstrap_seed = 20260814    # Options: any integer

[representations]
# Feature sets available to tabular architectures; each architecture's own
# "feature_sets" must be a subset of this.
tabular_feature_sets = [    # Options: any subset of the four below
    "age_only",
    "last_values",
    "screened",
    "all_nonconstant",
]
# Telemetry channels sequence models receive; must equal the list length below.
sequence_channel_count = 22    # Options: any positive integer
# The channels kept after Phase 0 screening, listed explicitly so later code
# never depends on CSV column order.
sequence_channels = [    # Options: any list of unique channel names
    "telemetry_01",
    "telemetry_02",
    "telemetry_04",
    "telemetry_05",
    "telemetry_06",
    "telemetry_07",
    "telemetry_09",
    "telemetry_10",
    "telemetry_11",
    "telemetry_12",
    "telemetry_13",
    "telemetry_15",
    "telemetry_16",
    "telemetry_18",
    "telemetry_19",
    "telemetry_21",
    "telemetry_22",
    "telemetry_23",
    "telemetry_24",
    "telemetry_25",
    "telemetry_26",
    "telemetry_28",
]
# History-window lengths in flight cycles every sequence model is compared at;
# shorter histories are padded on the left and marked by a mask.
sequence_lookbacks = [50, 100]    # Options: any list of positive integers
# Age features sent alongside telemetry, because a fixed window alone does not
# say where the UAV is in its lifetime.
sequence_side_features = ["flight_cycle", "log1p_flight_cycle"]    # Options: any subset of these two

[preprocessing]
# Architectures receiving robust median/IQR scaled tabular inputs.
scaled_tabular_architectures = ["regularized_linear", "mlp", "rbf_svr"]    # Options: any architecture names
# Architectures receiving unscaled values, since split ordering needs no scaling.
unscaled_tree_architectures = ["random_forest", "extra_trees", "xgboost", "catboost"]    # Options: any architecture names
# Every fitted statistic comes only from the current fold's training UAVs;
# validation UAVs are transformed but never influence a median or IQR.

[neural_training]
# Shared by every PyTorch family so their comparison never uses different
# optimization policies.
# Training examples per gradient step.
batch_size = 64    # Options: any positive integer
# Hard ceiling on epochs regardless of early stopping.
maximum_epochs = 400    # Options: any positive integer
# Epochs to wait for a validation improvement before stopping early.
early_stopping_patience = 20    # Options: any positive integer
# Maximum global gradient norm allowed before clipping.
gradient_clip_global_norm = 1.0    # Options: any positive float

# Architectures ==============================================================
# Each [architectures.*] table declares:
#   status          Options: "included", "conditional", "optional" (must match
#                   the [study] list the name appears in)
#   representation  Options: "none", "tabular", "sequence", "trajectory" (decides whether
#                   "feature_sets" or "lookbacks" applies)
#   feature_sets    Options: any subset of [representations].tabular_feature_sets
#   lookbacks       Options: any subset of [representations].sequence_lookbacks
#   variants        Options: the exact set the verifier requires per family
#
# Each [architectures.*.search.*] table declares one tunable hyperparameter as a
# "kind" plus its matching fields:
#   fixed                          value
#   categorical                    values
#   categorical_integer_sequences  values (a list of integer lists)
#   integer_range                  low, high, optionally step
#   uniform                        low, high
#   log_uniform                    low, high

# Predicts one constant, so it needs no model input at all.
[architectures.mean_baseline]
status = "included"
representation = "none"
variants = ["mean"]

# Predicts from UAV age alone, the simplest reference using any input.
[architectures.cycle_only_baseline]
status = "included"
representation = "tabular"
feature_sets = ["age_only"]
variants = ["weighted_linear"]

# Ridge and Elastic Net, the linear reference against the nonlinear families.
[architectures.regularized_linear]
status = "included"
representation = "tabular"
feature_sets = ["age_only", "last_values", "screened", "all_nonconstant"]
variants = ["ridge", "elastic_net"]

# Which variant is fitted; the choice activates either the ridge penalty or
# both Elastic Net parameters, and the inactive ones are ignored.
[architectures.regularized_linear.search.variant]
kind = "categorical"
values = ["ridge", "elastic_net"]

# Ridge penalty strength.
[architectures.regularized_linear.search.ridge_alpha]
kind = "log_uniform"
low = 1e-4
high = 1e4

# Elastic Net overall penalty strength.
[architectures.regularized_linear.search.elastic_net_alpha]
kind = "log_uniform"
low = 1e-2
high = 1e2

# Elastic Net balance between the L1 and L2 penalties.
[architectures.regularized_linear.search.elastic_net_l1_ratio]
kind = "categorical"
values = [0.05, 0.2, 0.5, 0.8, 0.95]

# Bagged decision trees, the first nonlinear tabular reference.
[architectures.random_forest]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["random_forest"]

# Trees in the forest.
[architectures.random_forest.search.n_estimators]
kind = "fixed"
value = 500

# Maximum tree depth; "none" is a portable sentinel the adapter turns into
# Python "None", because TOML has no null value.
[architectures.random_forest.search.max_depth]
kind = "categorical"
values = ["none", 5, 10, 20]

# Minimum training samples required in a leaf.
[architectures.random_forest.search.min_samples_leaf]
kind = "categorical"
values = [1, 2, 5, 10]

# Fraction of features considered at each split.
[architectures.random_forest.search.max_features]
kind = "categorical"
values = [0.15, 0.2, 0.33, 0.67, 1.0]

# Extremely randomized trees isolate the effect of random split thresholds
# while retaining the Random Forest capacity controls and tabular inputs.
[architectures.extra_trees]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["extra_trees"]

[architectures.extra_trees.search.n_estimators]
kind = "fixed"
value = 500

[architectures.extra_trees.search.max_depth]
kind = "categorical"
values = ["none", 5, 10, 20]

[architectures.extra_trees.search.min_samples_leaf]
kind = "categorical"
values = [1, 2, 5, 10]

[architectures.extra_trees.search.max_features]
kind = "categorical"
values = [0.15, 0.2, 0.33, 0.67, 1.0]

# Gradient-boosted trees, the second nonlinear tabular reference.
[architectures.xgboost]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["xgboost"]
# Boosting rounds without improvement before stopping; this family stops on
# rounds, so it ignores [neural_training].early_stopping_patience.
early_stopping_patience = 35    # Options: any positive integer

# Ceiling on boosting rounds, set high because early stopping usually ends
# training well before it.
[architectures.xgboost.search.maximum_trees]
kind = "fixed"
value = 1500

# Shrinkage applied to each boosting round's contribution.
[architectures.xgboost.search.learning_rate]
kind = "log_uniform"
low = 0.01
high = 0.2

# Maximum depth of each boosted tree.
[architectures.xgboost.search.max_depth]
kind = "categorical"
values = [2, 3, 4, 6, 8]

# Minimum summed instance weight required in a child node.
[architectures.xgboost.search.min_child_weight]
kind = "log_uniform"
low = 0.5
high = 20.0

# Fraction of training rows sampled per boosting round.
[architectures.xgboost.search.subsample]
kind = "uniform"
low = 0.6
high = 1.0

# Fraction of features sampled per tree.
[architectures.xgboost.search.colsample_bytree]
kind = "uniform"
low = 0.5
high = 1.0

# L1 regularization on leaf weights.
[architectures.xgboost.search.reg_alpha]
kind = "log_uniform"
low = 1e-8
high = 10.0

# L2 regularization on leaf weights.
[architectures.xgboost.search.reg_lambda]
kind = "log_uniform"
low = 1e-3
high = 100.0

# CatBoost provides a second regularized boosting mechanism over the same
# numerical engineered features. CPU execution is fixed for reproducibility.
[architectures.catboost]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["catboost"]
early_stopping_patience = 35

[architectures.catboost.search.maximum_trees]
kind = "fixed"
value = 1500

[architectures.catboost.search.learning_rate]
kind = "log_uniform"
low = 0.01
high = 0.2

[architectures.catboost.search.depth]
kind = "categorical"
values = [4, 6, 8, 10]

[architectures.catboost.search.l2_leaf_reg]
kind = "log_uniform"
low = 1e-2
high = 100.0

[architectures.catboost.search.random_strength]
kind = "log_uniform"
low = 1e-3
high = 10.0

[architectures.catboost.search.bagging_temperature]
kind = "uniform"
low = 0.0
high = 1.0

[architectures.catboost.search.rsm]
kind = "uniform"
low = 0.5
high = 1.0

[architectures.catboost.search.boosting_type]
kind = "categorical"
values = ["Plain", "Ordered"]

# Feed-forward network on the same engineered rows the tree models use.
[architectures.mlp]
status = "included"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["mlp"]

# Hidden-layer layout; each nested list is one architecture, so [128, 64] means
# two layers of 128 then 64 units.
[architectures.mlp.search.hidden_layers]
kind = "categorical_integer_sequences"
values = [[64], [128, 64], [256, 128], [512, 256], [512, 256, 128]]

# Dropout probability after each hidden layer.
[architectures.mlp.search.dropout]
kind = "uniform"
low = 0.0
high = 0.5

# Adam learning rate.
[architectures.mlp.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 1e-2

# L2 weight decay applied by the optimizer.
[architectures.mlp.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Temporal convolutional network over raw telemetry windows.
[architectures.tcn]
status = "included"
representation = "sequence"
lookbacks = [50, 100]
variants = ["tcn"]

# Stacked residual blocks, which together set the temporal receptive field.
[architectures.tcn.search.residual_blocks]
kind = "categorical"
values = [3, 4, 5]

# Convolution channels per residual block.
[architectures.tcn.search.channels]
kind = "categorical"
values = [32, 64, 128]

# Width of each causal convolution kernel.
[architectures.tcn.search.kernel_size]
kind = "categorical"
values = [5, 7]

# Dilation growth per block, fixed at doubling so the receptive field expands
# while the search space stays compact.
[architectures.tcn.search.dilation_base]
kind = "fixed"
value = 2

# Dropout probability inside each residual block.
[architectures.tcn.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

# Adam learning rate.
[architectures.tcn.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 1e-2

# L2 weight decay applied by the optimizer.
[architectures.tcn.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Parallel causal convolutions summarize degradation patterns at several
# temporal scales without changing the existing sequence representation.
[architectures.multiscale_cnn]
status = "included"
representation = "sequence"
lookbacks = [50, 100]
variants = ["multiscale_cnn"]

# Width produced by each parallel temporal branch.
[architectures.multiscale_cnn.search.branch_channels]
kind = "categorical"
values = [16, 32, 64]

# The three kernel widths used together by one candidate. All choices are odd
# so causal padding has an unambiguous temporal center and preserved length.
[architectures.multiscale_cnn.search.kernel_sizes]
kind = "categorical_integer_sequences"
values = [[3, 5, 9], [3, 7, 15], [5, 11, 21]]

# Dropout inside the branches and regression head.
[architectures.multiscale_cnn.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

# Adam learning rate.
[architectures.multiscale_cnn.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 1e-2

# L2 weight decay applied by the optimizer.
[architectures.multiscale_cnn.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# A fold-fitted sensor-correlation graph mixes telemetry channels before a
# causal temporal convolutional stack models degradation over time.
[architectures.sensor_graph_tcn]
status = "included"
representation = "sequence"
lookbacks = [50, 100]
variants = ["sensor_graph_tcn"]

# Hidden feature width retained for each sensor node.
[architectures.sensor_graph_tcn.search.graph_hidden]
kind = "categorical"
values = [8, 16, 32]

# Consecutive graph message-passing layers at each time step.
[architectures.sensor_graph_tcn.search.graph_layers]
kind = "categorical"
values = [1, 2]

# Strongest absolute-correlation neighbours retained per sensor before the
# graph is symmetrized and normalized.
[architectures.sensor_graph_tcn.search.graph_neighbors]
kind = "categorical"
values = [3, 5, 8]

# Dilated residual blocks used after graph feature extraction.
[architectures.sensor_graph_tcn.search.temporal_blocks]
kind = "categorical"
values = [2, 3, 4]

# Width of every temporal residual block.
[architectures.sensor_graph_tcn.search.temporal_channels]
kind = "categorical"
values = [32, 64]

# Width of each causal temporal convolution.
[architectures.sensor_graph_tcn.search.kernel_size]
kind = "categorical"
values = [3, 5]

# Dropout in graph and temporal layers.
[architectures.sensor_graph_tcn.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

# Adam learning rate.
[architectures.sensor_graph_tcn.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 1e-2

# L2 weight decay applied by the optimizer.
[architectures.sensor_graph_tcn.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Recurrent network over the same telemetry windows the TCN receives.
[architectures.lstm]
status = "included"
representation = "sequence"
lookbacks = [50, 100]
variants = ["lstm"]

# Stacked recurrent layers.
[architectures.lstm.search.layers]
kind = "categorical"
values = [1, 2, 3]

# Hidden state size per layer.
[architectures.lstm.search.hidden_units]
kind = "categorical"
values = [32, 64, 128]

# Recurrence direction, fixed unidirectional so only past and current
# observations can influence a prediction.
[architectures.lstm.search.direction]
kind = "fixed"
value = "unidirectional"

# Dropout probability between recurrent layers.
[architectures.lstm.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

# Adam learning rate.
[architectures.lstm.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 1e-2

# L2 weight decay applied by the optimizer.
[architectures.lstm.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Disabled extensions stay fully specified, so enabling one is a deliberate
# one-line change in [study.enabled] against a documented search space.

# Attention encoder over telemetry windows, held back until TCN and LSTM prove
# out because 100 UAVs make attention an overfitting risk.
[architectures.transformer]
status = "conditional"
representation = "sequence"
lookbacks = [50, 100]
variants = ["transformer_encoder"]

# Stacked encoder layers.
[architectures.transformer.search.encoder_layers]
kind = "categorical"
values = [1, 2, 3]

# Model embedding width.
[architectures.transformer.search.model_width]
kind = "categorical"
values = [32, 64, 128]

# Parallel attention heads per encoder layer.
[architectures.transformer.search.attention_heads]
kind = "categorical"
values = [2, 4, 8]

# Feed-forward block width as a multiple of the model width.
[architectures.transformer.search.feed_forward_ratio]
kind = "categorical"
values = [2, 4]

# How time-step order is encoded.
[architectures.transformer.search.position_encoding]
kind = "fixed"
value = "sinusoidal"

# Dropout probability inside each encoder layer.
[architectures.transformer.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

# Adam learning rate.
[architectures.transformer.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 1e-2

# L2 weight decay applied by the optimizer.
[architectures.transformer.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Kernel support vector regression, an extra nonlinear reference.
[architectures.rbf_svr]
status = "optional"
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["rbf_svr"]

# Penalty on training errors, trading margin width against training fit.
[architectures.rbf_svr.search.c]
kind = "log_uniform"
low = 1e-2
high = 1e3

# Width of the radial basis kernel.
[architectures.rbf_svr.search.gamma]
kind = "log_uniform"
low = 1e-5
high = 1.0

# Half-width of the tube inside which errors cost nothing.
[architectures.rbf_svr.search.epsilon]
kind = "log_uniform"
low = 1e-3
high = 10.0

# Similarity-based trajectory retrieval using constrained multivariate DTW.
# All values are fixed for the first architecture-study implementation so this
# deterministic reference model contributes one candidate per outer fold.
[architectures.trajectory_dtw_knn]
status = "optional"
representation = "trajectory"
variants = ["dtw_knn"]

[architectures.trajectory_dtw_knn.search.neighbors]
kind = "fixed"
value = 5

[architectures.trajectory_dtw_knn.search.reference_pool_size]
kind = "fixed"
value = 20

[architectures.trajectory_dtw_knn.search.max_points]
kind = "fixed"
value = 48

[architectures.trajectory_dtw_knn.search.warping_window]
kind = "fixed"
value = 8

[architectures.trajectory_dtw_knn.search.distance_power]
kind = "fixed"
value = 1.0

# Phase 1 inputs =============================================================
# Phase 2 consumes the folds, prefix samples, features, preprocessing and
# metric definitions already built in Phase 1. Paths stay relative to the
# repository root so the project is portable. No hashes or frozen copies are
# used; the verifier checks the interface Phase 2 needs: existence, dimensions,
# required fields, critical values, leakage assertions and cross-file agreement.
#
# Each [phase_1.artifacts.*] table declares:
#   path                  Options: any repository-relative path
#   format                Options: "csv", "json"
#   rows, total_columns   Options: any non-negative integer (csv)
#   feature_columns       Options: any non-negative integer (csv feature tables)
#   required_columns      Options: any list of column names (csv)
#   required_json_keys    Options: any list of top-level keys (json)
# A nested [*.required_json_values] table lists scalars that must match exactly;
# other metadata in those files may change freely.

[phase_1]
# Expected quantities from the dataset-construction protocol; a mismatch means
# Phase 1 changed and these settings need review. Options: any positive integer.
expected_training_uavs = 100
expected_outer_folds = 5
expected_inner_folds_per_outer_fold = 4
expected_development_scenarios = 5
expected_locked_scenarios = 20
expected_prefixes_per_training_uav = 20
expected_generated_features = 606

[phase_1.expected_feature_sets]
# "feature__*" column count in each named feature set. Options: positive integer.
age_only = 2
last_values = 24
screened = 310
all_nonconstant = 606

# The Phase 1 leakage-check report, whose passed status gates everything else.
[phase_1.artifacts.verification_report]
path = "1_dataset_construction/10_automated_leakage_checks/artifacts/verification_report.json"
format = "json"
required_json_keys = ["status", "assertions", "feature_files", "feature_sets"]

[phase_1.artifacts.verification_report.required_json_values]
status = "passed"
development_scenarios = 5
locked_scenarios = 20

# How the UAV-grouped outer and inner folds were generated.
[phase_1.artifacts.fold_config]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/fold_config.json"
format = "json"
required_json_keys = ["group_key", "outer_folds", "inner_folds", "seed"]

[phase_1.artifacts.fold_config.required_json_values]
group_key = "uav_id"
outer_folds = 5
inner_folds = 4

# Outer-fold assignment for every training UAV.
[phase_1.artifacts.outer_folds]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/outer_folds.csv"
format = "csv"
rows = 100
total_columns = 6
required_columns = [
    "uav_id",
    "row_count",
    "final_cycle",
    "terminal_lifetime",
    "lifetime_quantile",
    "outer_fold",
]

# Inner-fold assignment within each outer fold.
[phase_1.artifacts.inner_folds]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/inner_folds.csv"
format = "csv"
rows = 400
total_columns = 7
required_columns = [
    "outer_fold",
