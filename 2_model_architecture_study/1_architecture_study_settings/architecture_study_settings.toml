    "final_cycle",
    "terminal_lifetime",
    "lifetime_quantile",
    "outer_fold",
]

[phase_1.artifacts.inner_folds]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/inner_folds.csv"
format = "csv"
rows = 400
total_columns = 7
