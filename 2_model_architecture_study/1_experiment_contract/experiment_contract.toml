# Human-readable source of truth for the Phase 2 architecture study.
#
# Later scripts must read the generated JSON specification, which is created
# from this file only after schema and Phase 1 input verification.  Scientific
# values cannot be overridden through command-line flags.  This keeps every run
# traceable to one inspectable configuration.
#
# Increment this integer manually whenever an experiment setting changes.  It
# is a simple revision number, not an automatic model or data version.
contract_version = 1
phase = "model_architecture_study"

[study]
# Required architectures form the comparison that must always be executed.
# Conditional and optional architectures stay explicit in the contract but are
# skipped while "enabled = false" in their individual tables below.
required_architectures = [
    "mean_baseline",
    "cycle_only_baseline",
    "regularized_linear",
    "random_forest",
    "xgboost",
    "mlp",
    "tcn",
    "lstm",
]
conditional_architectures = ["transformer"]
optional_architectures = ["rbf_svr"]

# The pipeline saves every architecture's predictions, metrics, and comparison
# plots.  It never declares a winner; the final selection is made by the user
# after inspecting the complete evidence.
architecture_selection = "manual"
save_all_architecture_results = true
create_comparison_plots = true

[tuning]
# Hyperparameters are optimized independently inside each architecture family.
# The tuner may choose the best configuration of a model, but it may not choose
# one architecture over another.
scope = "within_architecture"
primary_metric = "rmse"
direction = "minimize"
candidate_budget_per_architecture = 25

# The search seed makes candidate generation repeatable.  The retraining seeds
# quantify variation in stochastic architectures after tuning has finished.
search_seed = 13
retraining_seeds = [13, 37, 73]

# For early-stopped models, use the median best iteration/epoch found in the
# inner folds when retraining on the outer-fold development data.  This avoids
# looking at the outer validation targets to decide training duration.
outer_retraining_duration = "median_inner_best_iteration"

[evaluation]
# Every architecture is evaluated with the same metrics and report breakdowns.
# RMSE is the tuning objective; the other metrics expose complementary error
# properties and are not combined into an automatic ranking score.
metrics = ["r2", "rmse", "mae", "bias"]
reported_groups = [
    "overall",
    "scenario",
    "outer_fold",
    "age_band",
    "lifetime_quantile",
]

# RUL cannot be negative, so reported predictions are clipped at zero.  Equal
# total UAV weight prevents UAVs that generated more prefix samples from having
# greater influence solely because of their history length.
prediction_minimum = 0.0
equal_total_weight_per_uav = true

# Resampling whole UAVs preserves the dependence among prefixes from the same
# vehicle when confidence intervals are calculated.
bootstrap_unit = "uav_id"
bootstrap_repetitions = 1000
bootstrap_seed = 20260814

[representations]
# Tabular adapters select one of the Phase 1 feature-set columns.  Sequence
# adapters instead receive ordered telemetry windows from the explicit channel
# list below; the two input forms are kept separate by the verifier.
tabular_feature_sets = [
    "age_only",
    "last_values",
    "screened",
    "all_nonconstant",
]

# These are the 22 telemetry channels retained after Phase 0 constant-feature
# screening.  Storing every name explicitly prevents later code from depending
# on incidental CSV column order.
sequence_channel_count = 22
sequence_channels = [
    "telemetry_01",
    "telemetry_02",
    "telemetry_04",
    "telemetry_05",
    "telemetry_06",
    "telemetry_07",
    "telemetry_09",
    "telemetry_10",
    "telemetry_11",
    "telemetry_12",
    "telemetry_13",
    "telemetry_15",
    "telemetry_16",
    "telemetry_18",
    "telemetry_19",
    "telemetry_21",
    "telemetry_22",
    "telemetry_23",
    "telemetry_24",
    "telemetry_25",
    "telemetry_26",
    "telemetry_28",
]

# Each sequence model is compared at the same three history-window lengths.
# Histories shorter than the selected lookback are padded on the left, and the
# mask tells the model which time steps are padding rather than observations.
sequence_lookbacks = [50, 100, 200]
sequence_padding = "left"
sequence_padding_mask = true

# Absolute age is supplied alongside telemetry because a fixed-length window
# alone does not identify the UAV's current point in its observed lifetime.
sequence_side_features = ["flight_cycle", "log1p_flight_cycle"]

[preprocessing]
# Models sensitive to feature scale use robust median/IQR scaling.  Tree models
# receive unchanged numeric values because their split ordering does not need
# scale normalization.
scaled_tabular_architectures = ["regularized_linear", "mlp", "rbf_svr"]
unscaled_tree_architectures = ["random_forest", "xgboost"]
tabular_scaling = "median_iqr"
sequence_scaling = "training_fold_channel_median_iqr"

# Every fitted preprocessing statistic is learned only from training UAVs in
# the current fold.  Validation UAVs may be transformed but never influence the
# medians or IQRs, preventing validation leakage.
fit_scope = "training_uavs_only"

[neural_training]
# These settings are shared by MLP, TCN, LSTM, and the disabled Transformer so
# their comparison does not accidentally use different optimization policies.
# Architecture-specific sizes, dropout, and learning rates remain tunable below.
loss = "weighted_mse"
optimizer = "adamw"
batch_size = 64
maximum_epochs = 300
early_stopping_patience = 25
gradient_clip_global_norm = 1.0

# Required baselines ---------------------------------------------------------
# Baselines verify that complex models improve on simple references.  The mean
# baseline needs no model input; the cycle-only baseline receives only age.

[architectures.mean_baseline]
status = "required"
enabled = true
representation = "none"
variants = ["mean"]

[architectures.cycle_only_baseline]
status = "required"
enabled = true
representation = "tabular"
feature_sets = ["age_only"]
variants = ["weighted_linear"]

# Required tabular architectures --------------------------------------------
# All tabular families consume the same Phase 1 prefix-feature rows.  Their
# "feature_sets" lists define which predeclared feature subsets are compared.

[architectures.regularized_linear]
status = "required"
enabled = true
representation = "tabular"
feature_sets = ["age_only", "last_values", "screened", "all_nonconstant"]
variants = ["ridge", "elastic_net"]

[architectures.regularized_linear.search.variant]
# The variant choice activates either the ridge parameter or both Elastic Net
# parameters.  Inactive variant-specific values are ignored by its adapter.
kind = "categorical"
values = ["ridge", "elastic_net"]

[architectures.regularized_linear.search.ridge_alpha]
kind = "log_uniform"
low = 1e-4
high = 1e4

[architectures.regularized_linear.search.elastic_net_alpha]
kind = "log_uniform"
low = 1e-5
high = 1e2

[architectures.regularized_linear.search.elastic_net_l1_ratio]
kind = "categorical"
values = [0.05, 0.2, 0.5, 0.8, 0.95]

[architectures.random_forest]
status = "required"
enabled = true
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["random_forest"]

[architectures.random_forest.search.n_estimators]
kind = "fixed"
value = 500

[architectures.random_forest.search.max_depth]
# "none" is a portable TOML sentinel that the model adapter converts to
# Python "None". TOML has no native null value.
kind = "categorical"
values = ["none", 5, 10, 20]

[architectures.random_forest.search.min_samples_leaf]
kind = "categorical"
values = [1, 2, 5, 10]

[architectures.random_forest.search.max_features]
kind = "categorical"
values = [0.33, 0.67, 1.0]

[architectures.xgboost]
status = "required"
enabled = true
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["xgboost"]
early_stopping_patience = 50

# A large fixed tree ceiling works with early stopping: training may stop well
# before 2,000 trees when the inner-fold validation score no longer improves.

[architectures.xgboost.search.maximum_trees]
kind = "fixed"
value = 2000

[architectures.xgboost.search.learning_rate]
kind = "log_uniform"
low = 0.01
high = 0.2

[architectures.xgboost.search.max_depth]
kind = "categorical"
values = [2, 3, 4, 6, 8]

[architectures.xgboost.search.min_child_weight]
kind = "log_uniform"
low = 0.5
high = 20.0

[architectures.xgboost.search.subsample]
kind = "uniform"
low = 0.6
high = 1.0

[architectures.xgboost.search.colsample_bytree]
kind = "uniform"
low = 0.5
high = 1.0

[architectures.xgboost.search.reg_alpha]
kind = "log_uniform"
low = 1e-8
high = 10.0

[architectures.xgboost.search.reg_lambda]
kind = "log_uniform"
low = 1e-3
high = 100.0

# Required neural architectures ---------------------------------------------
# The MLP uses engineered tabular rows.  TCN and LSTM use padded ordered
# telemetry windows, allowing the study to compare feature-based and end-to-end
# sequence representations under the same folds and metrics.

[architectures.mlp]
status = "required"
enabled = true
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["mlp"]

[architectures.mlp.search.hidden_layers]
# Each nested integer list is one complete hidden-layer layout, e.g. [128, 64]
# means a two-layer MLP with 128 then 64 hidden units.
kind = "categorical_integer_sequences"
values = [[64], [128, 64], [256, 128]]

[architectures.mlp.search.dropout]
kind = "uniform"
low = 0.0
high = 0.5

[architectures.mlp.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.mlp.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

[architectures.tcn]
status = "required"
enabled = true
representation = "sequence"
lookbacks = [50, 100, 200]
variants = ["tcn"]

[architectures.tcn.search.residual_blocks]
kind = "categorical"
values = [2, 3, 4]

[architectures.tcn.search.channels]
kind = "categorical"
values = [32, 64, 128]

[architectures.tcn.search.kernel_size]
kind = "categorical"
values = [3, 5, 7]

[architectures.tcn.search.dilation_base]
# Fixed doubling of dilation expands the temporal receptive field across
# residual blocks while keeping the tunable search space compact.
kind = "fixed"
value = 2

[architectures.tcn.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

[architectures.tcn.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.tcn.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

[architectures.lstm]
status = "required"
enabled = true
representation = "sequence"
lookbacks = [50, 100, 200]
variants = ["lstm"]

[architectures.lstm.search.layers]
kind = "categorical"
values = [1, 2]

[architectures.lstm.search.hidden_units]
kind = "categorical"
values = [32, 64, 128]

[architectures.lstm.search.direction]
# Only past and current observations may influence a prediction.  A
# unidirectional LSTM makes that temporal direction explicit.
kind = "fixed"
value = "unidirectional"

[architectures.lstm.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

[architectures.lstm.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.lstm.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

# Disabled extensions --------------------------------------------------------
# Disabled architectures remain fully specified so enabling one is a deliberate
# one-line status change and uses a documented search space.  They are not run
# in the required comparison while "enabled = false".

[architectures.transformer]
status = "conditional"
enabled = false
representation = "sequence"
lookbacks = [50, 100, 200]
variants = ["transformer_encoder"]

[architectures.transformer.search.encoder_layers]
kind = "categorical"
values = [1, 2, 3]

[architectures.transformer.search.model_width]
kind = "categorical"
values = [32, 64, 128]

[architectures.transformer.search.attention_heads]
kind = "categorical"
values = [2, 4, 8]

[architectures.transformer.search.feed_forward_ratio]
kind = "categorical"
values = [2, 4]

[architectures.transformer.search.position_encoding]
kind = "fixed"
value = "sinusoidal"

[architectures.transformer.search.dropout]
kind = "uniform"
low = 0.1
high = 0.5

[architectures.transformer.search.learning_rate]
kind = "log_uniform"
low = 1e-4
high = 3e-3

[architectures.transformer.search.weight_decay]
kind = "log_uniform"
low = 1e-6
high = 1e-2

[architectures.rbf_svr]
status = "optional"
enabled = false
representation = "tabular"
feature_sets = ["last_values", "screened", "all_nonconstant"]
variants = ["rbf_svr"]

[architectures.rbf_svr.search.c]
kind = "log_uniform"
low = 1e-2
high = 1e3

[architectures.rbf_svr.search.gamma]
kind = "log_uniform"
low = 1e-5
high = 1.0

[architectures.rbf_svr.search.epsilon]
kind = "log_uniform"
low = 1e-3
high = 10.0

# Phase 1 inputs -------------------------------------------------------------
# Phase 2 consumes the already constructed folds, prefix samples, engineered
# features, preprocessing definition, and metric definition from Phase 1.
# Paths remain relative to the repository root so the project is portable.
#
# No hashes or frozen copies are used.  Instead, the verifier checks the stable
# interface needed by Phase 2: file existence, dimensions, required fields,
# critical values, passed leakage assertions, and cross-file agreement.

[phase_1]
# These expected quantities summarize the dataset-construction protocol.  A
# mismatch indicates that Phase 1 changed and this contract must be reviewed.
expected_training_uavs = 100
expected_outer_folds = 5
expected_inner_folds_per_outer_fold = 4
expected_development_scenarios = 5
expected_locked_scenarios = 20
expected_prefixes_per_training_uav = 20
expected_generated_features = 606

[phase_1.expected_feature_sets]
# Values are counts of "feature__*" columns in each named Phase 1 feature set.
age_only = 2
last_values = 24
screened = 310
all_nonconstant = 606

[phase_1.artifacts.verification_report]
# JSON artifacts declare keys that must exist and selected scalar values that
# must match exactly.  Other metadata may evolve without breaking this contract.
path = "1_dataset_construction/10_automated_leakage_checks/artifacts/verification_report.json"
format = "json"
required_json_keys = ["status", "assertions", "feature_files", "feature_sets"]

[phase_1.artifacts.verification_report.required_json_values]
status = "passed"
development_scenarios = 5
locked_scenarios = 20

[phase_1.artifacts.fold_config]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/fold_config.json"
format = "json"
required_json_keys = ["group_key", "outer_folds", "inner_folds", "seed"]

[phase_1.artifacts.fold_config.required_json_values]
group_key = "uav_id"
outer_folds = 5
inner_folds = 4

[phase_1.artifacts.outer_folds]
# CSV artifacts declare their row/column dimensions and metadata interface.
# Feature tables additionally declare "feature_columns" below.
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/outer_folds.csv"
format = "csv"
rows = 100
total_columns = 6
required_columns = [
    "uav_id",
    "row_count",
    "final_cycle",
    "terminal_lifetime",
    "lifetime_quantile",
    "outer_fold",
]

[phase_1.artifacts.inner_folds]
path = "1_dataset_construction/2_UAV_grouped_validation_folds/artifacts/inner_folds.csv"
format = "csv"
rows = 400
total_columns = 7
required_columns = [
    "outer_fold",
    "uav_id",
    "row_count",
    "final_cycle",
    "terminal_lifetime",
    "lifetime_quantile",
    "inner_fold",
]

[phase_1.artifacts.scenario_config]
path = "1_dataset_construction/3_test_like_validation_scenarios/artifacts/scenario_config.json"
