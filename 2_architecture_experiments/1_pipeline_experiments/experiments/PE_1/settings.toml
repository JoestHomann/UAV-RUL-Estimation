# USER-EDITABLE SETTINGS FOR PE_1.
# Run this experiment with the run.py file beside this settings file.
# Edit [execution] for resources and [experiments.PE_1] for the scientific
# design. The run definition and script chain make execution reviewable.
include = ["../../_internal/shared_settings.toml"]

[pipeline]
experiment = "PE_1"
run = "run_1"

[execution]
max_workers = 6

[run_definitions.PE_1]
title = "Original architecture-study baseline"
description = "Resume or reproduce the original drift-pruned Phase 2 baseline."

[[run_definitions.PE_1.steps]]
name = "baseline_architecture_study"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--run", "PE_1"]
script_chain = "phase2_complete"

[script_chains.phase2_complete]
scripts = [
    "2_architecture_experiments/2_model_architecture_study/1_architecture_study_settings/build_architecture_study_settings.py",
    "2_architecture_experiments/2_model_architecture_study/2_tabular_data_adapter/build_tabular_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/3_sequence_data_adapter/build_sequence_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/3_trajectory_data_adapter/build_trajectory_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/4_model_adapters/build_model_registry.py",
    "2_architecture_experiments/2_model_architecture_study/run_phase_2.py",
    "2_architecture_experiments/2_model_architecture_study/7_architecture_comparison/run_architecture_comparison.py",
]

[experiments.PE_1]
artifact_root = true
enabled = true
from_stage = "phase2"
through_stage = "phase2"
phase_2_scope = "complete"
phase_1_profile = "drift_ablation"
phase_1_run_name = "PE_run_1"
phase_1_mode = "rebuild"
prefix_variant = "current20"
scenario_profile = "current"
phase_2_run_number = 6
phase_2_settings_version = 12
architectures = [
    "mean_baseline",
    "random_forest",
    "extra_trees",
    "xgboost",
]
feature_set = "screened_drift_pruned"
candidate_budget = 50
search_seed = 13
retraining_seeds = [13, 37, 73]
target_profile = "raw"
prediction_profile = "symmetric"
phase_3_enabled = false
phase_3_run_number = 4
phase_3_settings_version = 1
phase_3_selected_model_family = "xgboost"
phase_3_candidate_budget = 50
phase_3_search_seed = 13
phase_3_model_seed = 13

# Target/scenario 2x2 matrix. PE_1 supplies the current-scenario/raw-target
# cell. The three cells below stop after development-only Step 5 until one is
# selected and its phase_2_scope is deliberately changed to "complete".
