    ["baseline", "drop_07"],
    ["state_only", "drop_07"],
    ["strong_plus_state", "numeric_strong"],
    ["medium_plus_state", "state_only"],
]

# Tree settings, cap, rolling windows and weighting formulas are imported from
# v13 and recorded in the run registration. No parameter search or specialist.
