[study]
name = "PE_38_v13_telemetry_07_representation"
run = "run_1"
source = "other_pipelines/uav_rul_pipeline_v13.py"
feature_contract = "3_final_model_training_and_inference/runs/run_9/3_final_training_contract/artifacts/final_training_contract.json"
train = "data/train.csv"
test_cutoffs = "data/test.csv"
