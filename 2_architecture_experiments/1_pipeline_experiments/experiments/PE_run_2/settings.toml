# USER-EDITABLE SETTINGS FOR PE_run_2.
# Run this experiment with the run.py file beside this settings file.
# PE_run_1 is included as the frozen raw/current control in the 2x2 study.
# Edit [execution] once for resources. Edit [experiment_groups.*] to change
# comparisons and [experiments.*] to change individual scientific cells.
include = ["../PE_run_1/settings.toml"]

[execution]
max_workers = 6

[run_definitions.PE_run_2]
title = "Pipeline-structure and degradation-learning studies"
description = "Run all seven reviewable PE_run_2 experiment groups, or select individual steps."

[[run_definitions.PE_run_2.steps]]
name = "target_scenario_2x2"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_target_scenario_2x2"]
script_chain = "phase1_phase2_complete_group"

[[run_definitions.PE_run_2.steps]]
name = "signal_family_ablation"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_signal_family_ablation"]
script_chain = "phase1_phase2_selection_group"

[[run_definitions.PE_run_2.steps]]
name = "failure_cycle_target"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_failure_cycle_target"]
script_chain = "phase1_phase2_selection_group"

[[run_definitions.PE_run_2.steps]]
name = "baseline_normalization"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_baseline_normalization"]
script_chain = "phase1_phase2_selection_group"

[[run_definitions.PE_run_2.steps]]
name = "fault_mode"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_fault_mode"]
script_chain = "phase1_phase2_selection_group"

[[run_definitions.PE_run_2.steps]]
name = "signal_compression"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_signal_compression"]
script_chain = "phase1_phase2_selection_group"

[[run_definitions.PE_run_2.steps]]
name = "dense_prefix_training"
script = "2_architecture_experiments/1_pipeline_experiments/run_experiments.py"
arguments = ["--group", "PE_dense_prefix_training"]
script_chain = "phase1_phase2_selection_group"

[script_chains.phase1_phase2_selection_group]
scripts = [
    "1_dataset_construction/run_all.py",
    "2_architecture_experiments/2_model_architecture_study/1_architecture_study_settings/build_architecture_study_settings.py",
    "2_architecture_experiments/2_model_architecture_study/2_tabular_data_adapter/build_tabular_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/3_sequence_data_adapter/build_sequence_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/3_trajectory_data_adapter/build_trajectory_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/4_model_adapters/build_model_registry.py",
    "2_architecture_experiments/2_model_architecture_study/run_phase_2.py",
    "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py",
]

[script_chains.phase1_phase2_complete_group]
scripts = [
    "1_dataset_construction/run_all.py",
    "2_architecture_experiments/2_model_architecture_study/1_architecture_study_settings/build_architecture_study_settings.py",
    "2_architecture_experiments/2_model_architecture_study/2_tabular_data_adapter/build_tabular_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/3_sequence_data_adapter/build_sequence_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/3_trajectory_data_adapter/build_trajectory_data_adapter.py",
    "2_architecture_experiments/2_model_architecture_study/4_model_adapters/build_model_registry.py",
    "2_architecture_experiments/2_model_architecture_study/run_phase_2.py",
    "2_architecture_experiments/2_model_architecture_study/7_architecture_comparison/run_architecture_comparison.py",
    "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py",
]

[experiment_groups.PE_target_scenario_2x2]
pipeline_run = "PE_run_2"
control = "PE_run_1"
model_families = ["extra_trees", "xgboost"]
experiments = [
    "PE_run_1",
    "PE_2x2_current_cap125",
    "PE_2x2_early_raw",
    "PE_2x2_early_cap125",
]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE_signal_family_ablation]
pipeline_run = "PE_run_2"
control = "PE_signal_control"
experiments = [
    "PE_signal_control",
    "PE_signal_family_13_16_22_25_28",
    "PE_signal_family_19_21",
    "PE_signal_family_15_23",
    "PE_signal_family_07",
    "PE_signal_all_families",
]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE_failure_cycle_target]
pipeline_run = "PE_run_2"
control = "PE_failure_raw_rul"
experiments = ["PE_failure_raw_rul", "PE_failure_cycle"]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE_baseline_normalization]
pipeline_run = "PE_run_2"
control = "PE_normalization_raw"
experiments = [
    "PE_normalization_raw",
    "PE_normalization_robust",
    "PE_normalization_combined",
]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE_fault_mode]
pipeline_run = "PE_run_2"
control = "PE_fault_mode_global"
experiments = [
    "PE_fault_mode_global",
    "PE_fault_mode_indicator",
    "PE_fault_mode_experts",
]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE_signal_compression]
pipeline_run = "PE_run_2"
control = "PE_compression_individual"
experiments = [
    "PE_compression_individual",
    "PE_compression_median",
    "PE_compression_pca",
    "PE_compression_individual_median",
    "PE_compression_individual_pca",
]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

[experiment_groups.PE_dense_prefix_training]
pipeline_run = "PE_run_2"
control = "PE_dense_current20"
experiments = ["PE_dense_current20", "PE_dense_stride5"]
reporter = "2_architecture_experiments/1_pipeline_experiments/report_experiment_group.py"

