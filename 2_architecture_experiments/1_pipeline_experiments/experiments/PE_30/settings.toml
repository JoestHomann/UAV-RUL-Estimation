[pipeline]
experiment = "PE_30"
run = "run_1"

[run_definitions.PE_30]
title = "All-cycle sampling with the original XGBoost-CatBoost recipe"
description = "Compare dense training against verified sparse and Run 7 references, then confirm the fixed candidate only if both screening gates pass."

[[run_definitions.PE_30.steps]]
name = "validate_inputs"
script = "2_architecture_experiments/1_pipeline_experiments/run_density_comparison.py"
arguments = ["--workflow", "PE_30", "--check"]
script_chain = "density_comparison"
status_artifact = "reporting/input_verification.json"

[[run_definitions.PE_30.steps]]
name = "evaluate_density_comparison"
script = "2_architecture_experiments/1_pipeline_experiments/run_density_comparison.py"
arguments = ["--workflow", "PE_30"]
script_chain = "density_comparison"
status_artifact = "reporting/winner_manifest.json"
supports_force = true

[script_chains.density_comparison]
scripts = ["2_architecture_experiments/1_pipeline_experiments/run_density_comparison.py"]

[density_workflows.PE_30]
source_registration = "2_architecture_experiments/1_pipeline_experiments/experiments/PE_28/runs/run_1/reporting/pre_registration.json"
feature_variant = "B_other"
reference_prefix_count = 20
screen_split_seed = 20270107
confirmation_split_seeds = [20270317, 20270327]
max_workers = 2
cpu_threads = 4
density_minimum_relative_rmse_improvement = 0.02
density_minimum_fold_wins = 4
reference_minimum_relative_rmse_improvement = 0.02
reference_minimum_fold_wins = 4
confirmation_minimum_relative_rmse_improvement = 0.02
confirmation_minimum_fold_wins = 8
confirmation_minimum_pooled_r2 = 0.90
